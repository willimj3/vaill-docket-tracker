# Config for the parked news / RECAP monitor crons. Set per case.
recipients:
  - you@example.org

email_format: plain

# Anchor term every news item must mention (case-insensitive), plus at least one
# relevance term below. Set these to your case's parties / keywords.
anchor_term: ""

sources:
  rss:
    - https://www.lawfaremedia.org/feed
    - https://www.justsecurity.org/feed/
    - https://www.scotusblog.com/feed/

relevance_terms: []

high_signal_descriptions:
  - regex: '(?i)opinion'
  - regex: '(?i)preliminary injunction'
  - regex: '(?i)temporary restraining order'
  - regex: '(?i)motion for summary judgment'
  - regex: '(?i)notice of appeal'

high_signal_exclude:
  - regex: '(?i)pro hac vice'
